<script>
const data=JSON.parse(document.querySelector('#data').textContent);
const names={R1:'R1 점유',R2:'R2 연결부',R3:'R3 가림',connection_actor:'연결부 이용자',forward_occlusion:'전방 가림',lateral_occlusion:'측방 가림',bottleneck:'병목'};
const panels=[...document.querySelectorAll('.panel')];
const buttonLists={scenes:[],fields:[]};
const images=new Map();
let sceneIndex=0, field='R2', zoomSide=0;
const toggles={stack:false,showD:true,showEvidence:true};
const get=id=>document.getElementById(id);
function addButton(parent,label,click){
 const button=document.createElement('button');
 button.type='button'; button.textContent=label; button.addEventListener('click',click);
 parent.append(button); return button;
}
data.forEach((scene,index)=>buttonLists.scenes.push(addButton(get('scenes'),scene.id,()=>{
 sceneIndex=index;
 field=Object.keys(names).find(key=>scene.sides[0].obs[key].state!==scene.sides[1].obs[key].state)||'R1';
 update();
})));
Object.entries(names).forEach(([key,label])=>{
 const button=addButton(get('fields'),'',()=>{field=key;update();});
 const name=document.createElement('span'); name.textContent=label;
 const states=document.createElement('small');
 button.append(name,states); buttonLists.fields.push({key,button,states});
});
function shape(ctx,points,color,fill,width=5){
 if(!points||points.length<3)return;
 ctx.beginPath();
 points.forEach(([x,y],index)=>{if(index)ctx.lineTo(x*ctx.canvas.width,y*ctx.canvas.height);else ctx.moveTo(x*ctx.canvas.width,y*ctx.canvas.height);});
 ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
}
function rectangle(box){
 if(!box)return null;
 const [x,y,w,h]=box;
 return [[x,y],[w,y],[w,h],[x,h]];
}
function tag(ctx,text,point){
 const x=point[0]*ctx.canvas.width,y=point[1]*ctx.canvas.height;
 ctx.font='bold 26px sans-serif';
 const w=ctx.measureText(text).width+16;
 const left=Math.max(0,Math.min(x,ctx.canvas.width-w));
 const top=Math.max(0,y-34);
 ctx.fillStyle='#171f25';ctx.fillRect(left,top,w,34);
 ctx.fillStyle='#fff';ctx.fillText(text,left+8,top+25);
}
function draw(canvas,side){
 const scene=data[sceneIndex], record=scene.sides[side], selected=record.obs[field];
 const ctx=canvas.getContext('2d');
 const image=images.get(scene.id);
 ctx.fillStyle='#1b252c';ctx.fillRect(0,0,canvas.width,canvas.height);
 if(!image||!image.complete||!image.naturalWidth){
  ctx.fillStyle='#e3f2f2';ctx.font='36px sans-serif';ctx.textAlign='center';
  ctx.fillText('원본 사진을 불러오면 근거를 표시합니다.',canvas.width/2,canvas.height/2);
  ctx.textAlign='start';return;
 }
 ctx.drawImage(image,0,0,canvas.width,canvas.height);
 if(toggles.showD)shape(ctx,record.d,'#5bfff4','rgba(0,225,207,.12)');
 if(!toggles.showEvidence)return;
 const highlighted=new Set(selected.object_ids);
 for(const region of record.regions){
  if(!selected.region_ids.includes(region.region_id))continue;
  const points=region.polygon_xy_norm||rectangle(region.bbox_xyxy_norm);
  if(points){shape(ctx,points,'#ffd15e','rgba(255,185,0,.33)',7);tag(ctx,region.region_id,points[0]);}
 }
 for(const object of record.objects){
  if(!highlighted.has(object.object_id)||!object.bbox_xyxy_norm)continue;
  const points=rectangle(object.bbox_xyxy_norm);
  shape(ctx,points,'#ffd15e','rgba(255,185,0,.06)',6);tag(ctx,object.object_id,points[0]);
 }
 for(const contact of record.points){
  if(!highlighted.has(contact.parent_object_id))continue;
  const [x,y]=contact.point_xy_norm;
  ctx.beginPath();ctx.arc(x*canvas.width,y*canvas.height,10,0,Math.PI*2);
  ctx.fillStyle='#ff65c8';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
 }
}
function redraw(){
 panels.forEach((panel,index)=>draw(panel.querySelector('canvas'),index));
 if(get('zoom').open)draw(get('zoom').querySelector('canvas'),zoomSide);
}
function update(){
 const scene=data[sceneIndex];
 get('photoStatus').textContent=(images.has(scene.id)?'불러온 사진: ':'이 장면의 파일: ')+scene.filename;
 get('selection').textContent=scene.id+' · '+names[field];
 buttonLists.scenes.forEach((button,index)=>button.setAttribute('aria-pressed',index===sceneIndex));
 buttonLists.fields.forEach(({key,button,states})=>{
  const [a,b]=scene.sides.map(side=>side.obs[key].state);
  states.textContent=a+' / '+b;button.classList.toggle('diff',a!==b);
  button.setAttribute('aria-pressed',key===field);
  button.setAttribute('aria-label',names[key]+', 이번 검토 '+a+', 11월 24일 검토 '+b+(a!==b?', 판정 다름':''));
 });
 panels.forEach((panel,index)=>{
  const record=scene.sides[index], selected=record.obs[field];
  panel.querySelector('.state').textContent=selected.state;
  panel.querySelector('.reason').textContent=selected.reason==='-'||!selected.reason?'—':selected.reason;
  const parts=[];
  if(selected.object_ids.length)parts.push('객체 '+selected.object_ids.join(' · '));
  if(selected.region_ids.length)parts.push('영역 '+selected.region_ids.map(id=>{
   const region=record.regions.find(item=>item.region_id===id);
   return region&&(region.polygon_xy_norm||region.bbox_xyxy_norm)?id:id+' (좌표 없음)';
  }).join(' · '));
  panel.querySelector('.ids').textContent=parts.join(' / ');
 });
 redraw();
}
Object.keys(toggles).forEach(key=>get(key).addEventListener('click',()=>{
 toggles[key]=!toggles[key]; get(key).setAttribute('aria-pressed',toggles[key]);
 if(key==='stack'){
  get('viewer').classList.toggle('stack',toggles[key]);
  get(key).textContent=toggles[key]?'기본 배치':'위아래로 보기';
 }
 redraw();
}));
panels.forEach((panel,index)=>panel.querySelector('.photo').addEventListener('click',()=>{
 zoomSide=index;
 get('zoomTitle').textContent=data[sceneIndex].id+' · '+names[field]+' · '+panel.querySelector('h2').textContent;
 get('zoom').showModal(); redraw();
}));
get('closeZoom').addEventListener('click',()=>get('zoom').close());
get('photos').addEventListener('change',async event=>{
 const rejected=[];
 const input=event.currentTarget;
 for(const file of input.files){
  const scene=data.find(item=>item.filename===file.name);
  if(!scene){rejected.push(file.name);continue;}
  try{
   if(window.crypto?.subtle){
    const digest=await crypto.subtle.digest('SHA-256',await file.arrayBuffer());
    const hash=Array.from(new Uint8Array(digest),byte=>byte.toString(16).padStart(2,'0')).join('');
    if(hash!==scene.sha256){rejected.push(file.name);continue;}
   }
   const url=URL.createObjectURL(file);
   try{
    const image=new Image();
    await new Promise((resolve,reject)=>{ image.onload=resolve; image.onerror=reject; image.src=url; });
    if(image.naturalWidth!==1920||image.naturalHeight!==1080){rejected.push(file.name);continue;}
    images.set(scene.id,image);
   } finally { URL.revokeObjectURL(url); }
  } catch { rejected.push(file.name); }
 }
 input.value='';
 update();
 if(rejected.length)get('photoStatus').textContent+=' · 확인할 파일: '+rejected.join(', ');
});
update();
</script>
