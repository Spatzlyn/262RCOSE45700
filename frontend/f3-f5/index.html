<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F3→F5 오류 근거 확인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* v2 (11/15): 글 줄이고 UI 위주. 상단 바 + F3 카드 목록 → F5 (이미지 | 관계·근거·대응). 설명·원문은 접힘/범례로 이동.
   색: GT 초록 실선 · 예측 보라 점선 · C 빨강 점선 · 선택 근거 노랑. U는 오류색 아님. */
:root{--bg:#f3f4f7;--panel:#fff;--soft:#f7f8fa;--fg:#161d33;--muted:#6c7488;--line:#e3e6ed;--line2:#cfd4de;
 --navy:#1b2742;--yellow:#ffdf3d;--gt:#1f7a46;--gt-s:#e3f3e9;--pred:#6d3fb0;--pred-s:#efe8f9;--c:#d0402f;--hl:#ffc400;
 --ok:#1f7a46;--ok-s:#e3f3e9;--bad:#b8332b;--bad-s:#fbe6e4;--warn:#8a5f00;--warn-s:#fbf0d2;--u:#3f5878;--u-s:#e5ecf5;--mock:#a6560a;--mock-s:#fdebd6;--real:#0d5f8a;--real-s:#dcf0fa;
 --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 24px}
.top .logo{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--yellow);color:var(--navy);font-weight:700}
.steps{display:flex;gap:4px;align-items:center}
.step{border:0;background:transparent;color:#aab4cd;padding:5px 10px;border-radius:7px;cursor:pointer;font-size:13px}
.step b{font-family:var(--mono);font-weight:500;font-size:11px;margin-right:5px;opacity:.8}
.step.cur{background:var(--yellow);color:var(--navy);font-weight:600}.step.off{opacity:.4;cursor:default}
.sp{flex:1}
.conn{display:flex;gap:6px;align-items:center}
.conn select,.conn input{background:#26345a;border:1px solid #4a5a82;color:#fff;border-radius:7px;padding:4px 8px;font-size:12.5px}
.conn input{width:190px;font-family:var(--mono);font-size:11.5px}
.dot{width:8px;height:8px;border-radius:50%;background:#7c869e}.dot.ok{background:#4cd08a}.dot.bad{background:#ff7b6e}
.rcard{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;cursor:pointer;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.rcard:hover{border-color:var(--navy)}.rcard.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}.prog i{display:block;height:100%}
.prog .v{background:var(--ok)}.prog .x{background:var(--bad)}.prog .w{background:var(--line2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){font-family:var(--mono);font-size:12px;word-break:break-all}
.core{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media (max-width:800px){.core{grid-template-columns:1fr}}
.big{padding:16px;display:grid;gap:6px}.big .lbl{font-size:12.5px;color:var(--muted)}.big .val{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.big .val.none{font-size:22px;color:var(--muted)}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}@media (max-width:800px){.groups{grid-template-columns:1fr}}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.mrow:first-of-type{border-top:0}.mrow b{font-variant-numeric:tabular-nums}.mrow .r{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:-4px}
.cells{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:12px;align-items:center}
.cell{border:1px solid var(--line);border-radius:7px;padding:5px 4px;text-align:center;font-variant-numeric:tabular-nums}
.cell.nil{border-style:dashed;color:var(--muted)}.cell small{display:block;font-size:10px;color:var(--muted)}
.ct{width:100%;border-collapse:collapse;font-size:12.5px}.ct th,.ct td{text-align:left;padding:7px 8px;border-top:1px solid var(--line)}.ct th{color:var(--muted);font-weight:500;border-top:0}
.rc.diff{border-color:#d9a800;background:#fff6cf}.rc.diff i{color:#7a5c00;font-weight:600}
.field{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;background:var(--panel);min-width:0}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.pick{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:12.5px}
.pick:has(input:checked){border-color:var(--navy);background:#fffbe6}
.note{font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--soft);border:1px solid var(--line)}
.note.bad{background:var(--bad-s);border-color:#e8b5b0;color:var(--bad)}.note.ok{background:var(--ok-s);border-color:#b9dcc6;color:var(--ok)}.note.warn{background:var(--warn-s);border-color:#ecd9a0;color:var(--warn)}
.msg{padding:36px 16px;text-align:center;display:grid;gap:10px;justify-items:center}
.msg code{font-family:var(--mono);font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.help{position:relative}.help summary{list-style:none;cursor:pointer;border:1px solid #4a5a82;border-radius:7px;padding:4px 10px;font-size:12.5px;color:#dfe5f2}
.help summary::-webkit-details-marker{display:none}
.help .pop{position:absolute;right:0;top:calc(100% + 8px);width:340px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 12px 32px rgba(22,29,51,.18);display:grid;grid-template-columns:auto 1fr;gap:8px 10px;font-size:12.5px;align-items:center}
.help .pop>.pill,.help .pop>.st,.help .pop>.ly{justify-self:start}
.help .pop h4{grid-column:1/-1;margin:4px 0 0;font-size:11px;color:var(--muted);letter-spacing:.06em}
.main{max-width:1240px;margin:0 auto;padding:20px 24px 56px;display:grid;gap:14px}
h1{margin:0;font-size:20px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;line-height:1.6}
.pill.real{background:var(--real-s);color:var(--real)}.pill.mock{background:var(--mock-s);color:var(--mock)}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.warn{background:var(--warn-s);color:var(--warn)}
.pill.na{border:1px dashed var(--line2);color:var(--muted)}.pill.dim{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.pill.gt{background:var(--gt-s);color:var(--gt)}.pill.pred{background:var(--pred-s);color:var(--pred)}
.st{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;font-size:12px;font-weight:600;font-family:var(--mono)}
.st.P{background:var(--fg);color:#fff}.st.A{background:var(--panel);color:var(--muted);border:1px solid var(--line2)}.st.U{background:var(--u-s);color:var(--u)}.st.X{border:1px dashed var(--line2);color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}.muted{color:var(--muted)}.small{font-size:12px}
.btn{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--navy)}.btn:disabled{opacity:.4;cursor:default}

/* F3 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px}.stat b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}.stat span{font-size:12px;color:var(--muted)}
.bar{padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel{border:1px solid var(--line2);border-radius:8px;padding:6px 8px;background:var(--panel);font-size:13px;cursor:pointer}
.sel.on{border-color:var(--navy);background:#fffbe6;font-weight:600}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
@media (max-width:900px){.relw{justify-items:start;grid-column:1/-1}.aux{justify-content:flex-start}}
.item{display:grid;grid-template-columns:104px minmax(0,1fr) auto minmax(150px,auto) 16px;gap:14px;align-items:center;padding:10px 14px;cursor:pointer;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.item:hover{border-color:var(--navy);box-shadow:0 2px 10px rgba(22,29,51,.07)}
.thumb{width:104px;aspect-ratio:16/9;border-radius:7px;overflow:hidden;background:#8d9aa6;position:relative}
.thumb img,.thumb svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item .t{display:grid;gap:3px;min-width:0}.item .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:12.5px}
.rels{display:grid;grid-template-columns:repeat(4,auto);gap:5px}
.rc{display:grid;gap:2px;justify-items:center;padding:4px 7px;border-radius:8px;border:1px solid var(--line);min-width:62px}
.rc i{font-style:normal;font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.rc .v{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--muted)}
.rc.bad{border-color:var(--bad);background:var(--bad-s)}.rc.bad i{color:var(--bad);font-weight:600}
/* v1.1 보조 4개: 핵심 관계 아래 작은 줄 */
.relw{display:grid;gap:4px;justify-items:end}
.aux{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.ax{display:inline-flex;gap:3px;align-items:center;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px;background:var(--panel)}
.ax .st{min-width:16px;height:16px;font-size:10px;padding:0 3px;border-radius:4px}
.ax.bad{border-color:#e8b5b0;background:var(--bad-s);color:var(--bad)}.ax.diff{border-color:#d9a800;background:#fff6cf;color:#7a5c00}
.ax.on{box-shadow:0 0 0 2px var(--navy);border-color:var(--navy)}
button.ax{cursor:pointer;font:inherit;font-size:11.5px;padding:3px 7px}
.res{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:44px 16px;text-align:center;display:grid;gap:10px;justify-items:center}
@media (max-width:900px){.item{grid-template-columns:84px minmax(0,1fr)}.thumb{width:84px}.rels,.res{grid-column:1/-1;justify-content:flex-start}.item>.chev{display:none}.stats{grid-template-columns:repeat(2,1fr)}}

/* F5 */
.verdict{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);border-left-width:5px}
.verdict.bad{border-left-color:var(--bad)}.verdict.ok{border-left-color:var(--ok)}.verdict.warn{border-left-color:var(--warn)}.verdict.na{border-left-color:var(--line2)}
.verdict b{font-size:15px}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
.left{display:grid;gap:8px;position:sticky;top:64px}@media (max-width:1000px){.left{position:static}}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#7c8794;border:1px solid var(--line)}
.stage img,.stage svg{position:absolute;inset:0;width:100%;height:100%}
.stage[data-image-state="loading"] svg,.stage[data-image-state="error"] svg,.stage[data-image-state="missing"] svg{visibility:hidden}
.photo-status{display:grid;position:absolute;inset:0;place-content:center;padding:16px;text-align:center;background:var(--panel);color:var(--fg)}
.photo-status[hidden]{display:none}
.layers{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ly{display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.ly i{width:16px;height:10px;border:2px solid;border-radius:2px}.ly.off{opacity:.45}
.ly .c{border-color:var(--c);border-style:dashed}.ly .g{border-color:var(--gt)}.ly .p{border-color:var(--pred);border-style:dashed}
.right{display:grid;gap:12px;min-width:0}
.sec{padding:14px;display:grid;gap:10px;align-content:start}
.sec h2{margin:0;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.sec>.pill{justify-self:start}
.sec h2 span{font-weight:400;color:var(--muted);font-size:12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{border:1px solid var(--line2);border-radius:10px;padding:8px 6px;background:var(--panel);cursor:pointer;display:grid;gap:5px;justify-items:center}
.tab .n{font-size:11.5px;color:var(--muted)}.tab .n b{font-family:var(--mono);color:var(--fg);margin-right:3px}
.tab .v{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:11px}
.tab.bad{background:var(--bad-s);border-color:#e8b5b0}.tab.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side{border-radius:10px;padding:10px;display:grid;gap:8px;align-content:start;min-width:0;background:var(--soft);border-top:3px solid}
.side.gt{border-color:var(--gt)}.side.pred{border-color:var(--pred)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11.5px;border-radius:6px;padding:2px 7px;cursor:pointer;border:1px solid var(--line2);background:var(--panel)}
.chip.gt{border-color:var(--gt);color:var(--gt)}.chip.pred{border-color:var(--pred);color:var(--pred);border-style:dashed}.chip.on{background:var(--hl);color:var(--navy);border-color:var(--hl);border-style:solid}
.need{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:13px}
.mark{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700}
.mark.y{background:var(--ok-s);color:var(--ok)}.mark.n{background:var(--bad-s);color:var(--bad)}.mark.q{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.cond{color:var(--muted);font-size:12px}
.or{color:var(--muted);font-size:11.5px;margin:0 4px}
.out{border-top:1px dashed var(--line2);padding-top:10px;display:grid;gap:6px}
details.more{border-top:1px solid var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
details.more .body{margin-top:8px;display:grid;gap:6px;font-size:12px}
details.more ul{margin:0;padding-left:18px;color:var(--muted)}
.why{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.why.open{display:block}
.raw{max-height:320px;overflow:auto;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-all;margin:0}
</style>

function svgFor(s){
  const W=1000,H=562.5,L=st.layers,hl=st.hl,any=hl.size>0;
  const rect=(b,cls,id,pos,thin)=>{if(!b)return'';const x=b[0]*W,y=b[1]*H,w=(b[2]-b[0])*W,h=(b[3]-b[1])*H,on=hl.has(id);
    const col=cls==='gt'?'var(--gt)':'var(--pred)',dash=thin?'stroke-dasharray="3 4"':cls==='gt'?'':'stroke-dasharray="8 5"';
    /* 라벨은 강조된 Box에만: 평소엔 박스만 보여서 사진이 덜 복잡함 */
    return `<g opacity="${any&&!on?.25:1}"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${on?'rgba(255,196,0,.22)':'none'}" stroke="${on?'var(--hl)':col}" stroke-width="${on?5:thin?1.6:2.5}" ${dash}/>${on?`<text x="${pos==='b'?x+w-3:x+3}" y="${pos==='b'?y+h+15:y-5}" text-anchor="${pos==='b'?'end':'start'}" font-size="13" font-weight="700" fill="#ffc400" stroke="rgba(0,0,0,.6)" stroke-width="3" paint-order="stroke">${esc(id)}</text>`:''}</g>`;};
  const region=(r,side)=>{
    const p=r.polygon||r.polygon_xy_norm,id=r.id||r.region_id;
    if(!Array.isArray(p)||p.length<3||!p.every(v=>Array.isArray(v)&&v.length===2&&v.every(n=>Number.isFinite(n)&&n>=0&&n<=1))){
      return rect(r.bbox||r.bbox_xyxy_norm,side,id,side==='gt'?'t':'b',side==='gt');
    }
    const on=hl.has(id),col=side==='gt'?'var(--gt)':'var(--pred)';
    const points=p.map(([x,y])=>[x*W,y*H]);
    const [lx,ly]=points.reduce((a,b)=>a[1]<=b[1]?a:b);
    return `<g opacity="${any&&!on?.25:1}"><polygon points="${points.map(v=>v.join(',')).join(' ')}" fill="${on?'rgba(255,196,0,.22)':'none'}" stroke="${on?'var(--hl)':col}" stroke-width="${on?5:2}" stroke-dasharray="${side==='gt'?'3 4':'8 5'}"/>${on?`<text x="${lx+4}" y="${Math.max(16,ly-6)}" font-size="13" font-weight="700" fill="#ffc400" stroke="rgba(0,0,0,.6)" stroke-width="3" paint-order="stroke">${esc(id)}</text>`:''}</g>`;
  };
  let g='';
  if(L.c&&s.C)g+=`<polygon points="${s.C.map(p=>p[0]*W+','+p[1]*H).join(' ')}" fill="rgba(208,64,47,.10)" stroke="var(--c)" stroke-width="2.5" stroke-dasharray="9 6"/>`;
  if(L.gt){s.gt.regions.forEach(r=>g+=region(r,'gt'));s.gt.objects.forEach(o=>g+=rect(o.bbox,'gt',o.id,'t'));}
  if(L.pred&&s.pred.valid){(s.pred.regions||[]).forEach(r=>g+=region(r,'pred'));s.pred.objects.forEach(o=>g+=rect(o.bbox,'pred',o.id,'b'));}
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
}

/* 필요 묶음별 ✓/✗: 예측 (대응, 조건) 쌍이 묶음의 대안과 같으면 충족. 백엔드 충족 수와 다르면 표시하지 않음(백엔드 값 우선). */
function groupHits(s){const ga=s.gt.actions,sc=s.scoring;if(!ga||!s.pred.valid||!sc.groups)return null;
  if(Array.isArray(sc.group_hits))return sc.group_hits;
  const hit=ga.required_groups.map(g=>g.alternatives.some(a=>s.pred.actions.some(p=>p.code===a.code&&p.condition===a.condition
    &&(a.based_on||[]).every(r=>(p.based_on||[]).includes(r)))));

function actionExclusion(s){

  if(reason==='reference_relations_only')return ['na','대응 채점 제외 · 관계만 검수','검수된 관계만 채점'];

  if(reason==='reference_missing'||s.review_status==='Missing')return ['warn','정답 없음 · 채점 제외',s.missing_reason||''];

        <h2>대응 ${sc.groups&&ga?`<span>필요 ${sc.groups[0]}/${sc.groups[1]} 충족</span>`:''}</h2>
        ${ga?ga.required_groups.map((x,i)=>`<div class="need"><span class="mark ${hits?(hits[i]?'y':'n'):'q'}">${hits?(hits[i]?'✓':'✕'):i+1}</span><div>${x.alternatives.map(a=>`<b>${actLbl(a.code)}</b> <span class="cond">${condLbl(a.condition)}</span>`).join('<span class="or">또는</span>')}</div></div>`).join('')
          :pill(exclusion[1],exclusion[0])}
        <div class="out"><div class="row">${pill('모델이 낸 대응','pred')}</div>
          ${s.pred.valid?(s.pred.actions.length?s.pred.actions.map(a=>`<div><b>${actLbl(a.code)}</b> <span class="cond">${condLbl(a.condition)}${a.based_on&&a.based_on.length?' · '+a.based_on.join(','):''}</span></div>`).join(''):'<span class="muted small">없음</span>'):pstPill(s.pred.status)}</div>
        ${ga&&ga.forbidden_pairs.length||raws.length?`<details class="more"><summary>금지 대응 ${ga?ga.forbidden_pairs.length:0}쌍${raws.length?` · 백엔드 원문 ${raws.length}건`:''}</summary><div class="body">
          ${ga&&ga.forbidden_pairs.length?`<ul>${ga.forbidden_pairs.map(a=>`<li>${actLbl(a.code)} · ${condLbl(a.condition)}</li>`).join('')}</ul>`:''}
          ${raws.length?`<ul>${raws.map(x=>`<li><span class="mono">${esc(x)}</span></li>`).join('')}</ul>`:''}</div></details>`:''}
      </section>
      <section class="card sec">
        <h2>객체 박스 비교 <span>${sc.no_grounding?(s.gt.objects.length?'정답 Box 검수 전 · 미채점':'정답 Box 없음 · 미채점'):`짝 ${sc.box_pairs.length} · 예측만 ${sc.unmatched_pred.length} · GT만 ${sc.unmatched_ref.length}`}</span></h2>
        ${REL===REL_V11?`<details class="more"><summary>객체 위치·방향 (보조 정보)</summary><div class="body">${[['라벨',s.gt.objects],['예측',s.pred.objects]].map(([l,os])=>`<div>${l}: ${os.map(o=>`${esc(o.id)} ${esc(o.location||'–')}/${esc(o.orientation||'–')}`).join(' · ')||'–'}</div>`).join('')}</div></details>`:''}
        <div class="chips">${sc.box_pairs.map(m=>`<button class="chip ${st.hl.has(m.prediction_id)&&st.hl.has(m.reference_id)?'on':''}" title="${esc(m.prediction_id)} ↔ ${esc(m.reference_id)}" onclick="toggleHl(['${m.prediction_id}','${m.reference_id}'])">${esc(m.prediction_id)} · IoU ${(+m.iou).toFixed(2)}</button>`).join('')}${sc.unmatched_pred.map(i=>`<button class="chip pred ${st.hl.has(i)?'on':''}" title="짝 없는 예측" onclick="toggleHl(['${i}'])">${esc(i)} · 짝 없음</button>`).join('')}${sc.no_grounding?s.pred.objects.map(o=>`<button class="chip pred ${st.hl.has(o.id)?'on':''}" onclick="toggleHl(['${o.id}'])">${esc(o.id)} · ${esc(o.class)}</button>`).join(''):!sc.box_pairs.length&&!sc.unmatched_pred.length?'<span class="muted small">예측 Box 없음</span>':''}</div>
        ${sc.unmatched_ref.length||s.run?`<details class="more"><summary>${sc.no_grounding?'Run 정보':`정답에만 있는 박스 ${sc.unmatched_ref.length}개${s.run?' · Run 정보':''}`}</summary><div class="body">
          ${sc.unmatched_ref.length?`<div class="chips">${sc.unmatched_ref.map(i=>`<button class="chip gt ${st.hl.has(i)?'on':''}" onclick="toggleHl(['${i}'])">${esc(i)}</button>`).join('')}</div>`:''}
          ${sc.unmeasurable_regions.length?`<div class="muted">비교할 수 없는 영역: ${sc.unmeasurable_regions.map(esc).join(', ')}</div>`:''}
          ${s.run?`${s.review_status!=='Reviewed'?'<div class="muted">정답이 아직 검수 전이라 짝 없는 예측을 오탐으로 단정하지 않음</div>':''}<div class="muted mono">${esc(s.run.name)} · ${esc(s.run.quant)} · adapter ${s.run.adapter??'없음(Base)'} · ${esc(s.run.branch)}@${esc(s.run.commit)}</div><div class="muted">${(s.blockers||[]).length?`공식 점수 미산출 사유: <span class="mono">${s.blockers.map(esc).join(', ')}</span>`:''}</div>`:''}</div></details>`:''}
      </section>
    </div>
  </div>`;
}
if(API_MODE){let b='http://localhost:8888';try{b=new URLSearchParams(location.search).get('api')||localStorage.getItem('f3f5_api')||b;}catch(e){}connect(b);}else render();
</script>
</html>
