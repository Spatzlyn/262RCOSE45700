# Starts automatically with the Docker daemon (restart: unless-stopped; docker.service is enabled on boot).
#   cd backend && SCORER_COMMIT=$(git log -1 --format=%H -- scorer app) docker compose up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SCORER_COMMIT: ${SCORER_COMMIT:-unknown}
    image: road-vlm-api:latest
    container_name: road-vlm-api
    restart: unless-stopped
    env_file:
      # API_WRITE_KEY / WORKER_KEY (not in git). Without it the write and worker APIs answer 503.
      - path: .env
        required: false
    environment:
      BOOTSTRAP_B: "2000"
    ports:
      - "8888:8888"
    volumes:
      # store lives outside the code folder so runs created through the API survive redeploys.
      # first deploy: copy backend/store there once (cp -rn backend/store/. /data/backend-store/)
      - ${STORE_DIR:-/data/backend-store}:/app/backend/store
      - ${IMAGE_DIR:-/data/aihub_71784/images}:/data/images:ro
